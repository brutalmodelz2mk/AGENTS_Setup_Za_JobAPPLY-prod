# Package metadata (used by `pip install -e .`)
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dzvonko-job-agent"
version = "0.1.0"
description = "Dzvonko — LangGraph job-application automation agent (discover → analyze → score → prepare → apply)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "langgraph>=1.0",
    "langchain-core>=0.3",
    "httpx>=0.27",
    "supabase>=2.10",
    "playwright>=1.49",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
